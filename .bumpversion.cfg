[bumpversion]
current_version = 2.2.0
commit = True
tag = True

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:README.md]
search = Version: {current_version}
replace = Version: {new_version}

[bumpversion:file(dockerpin0):docker/Dockerfile]
search = objectstore-mcp[mcp]=={current_version}
replace = objectstore-mcp[mcp]=={new_version}

[bumpversion:file:objectstore_mcp/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:objectstore_mcp/api_client.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:objectstore_mcp/mcp_server.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"
