[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "objectstore-mcp"
version = "2.0.0"
description = "Object storage (S3/MinIO/R2, Google Cloud Storage, Azure Blob, local filesystem) API + MCP Server + A2A Server for Agentic AI!"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "agent-utilities>=2.0.0,<3.0.0", "python-dotenv>=1.2.2",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "agent-utilities[mcp]>=2.0.0,<3.0.0",]
agent = [ "agent-utilities[agent-runtime,logfire]>=2.0.0,<3.0.0",]
s3 = [
    # CONCEPT:PHASE2-RECONCILE — relaxed off the modernize-bump's 1.43.52
    # floor: lighteval (pulled in via data-science-mcp[eval]) transitively
    # pins aioboto3, whose aiobotocore matrix only admits older boto3 ranges;
    # the pre-bump floor is the ecosystem-compatible one.
    "boto3>=1.34.0",
]
gcs = [ "google-cloud-storage>=3.13.0",]
azure = [ "azure-storage-blob>=12.30.0",]
all = [ "objectstore-mcp[mcp,agent,s3,gcs,azure,logfire]>=1.0.0",]
test = [ "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0", "moto[s3]>=5.2.2",]

[project.scripts]
objectstore-mcp = "objectstore_mcp.mcp_server:mcp_server"
objectstore-agent = "objectstore_mcp.agent_server:agent_server"

[project.entry-points."agent_utilities.skill_providers"]
objectstore-mcp = "objectstore_mcp.skills"

[project.entry-points."agent_utilities.ontology_providers"]
objectstore-mcp = "objectstore_mcp.ontology"

[project.entry-points."agent_utilities.source_connector_providers"]
objectstore-mcp = "objectstore_mcp.connectors"

[project.entry-points."agent_utilities.prompt_providers"]
objectstore-mcp = "objectstore_mcp.prompts"

[tool.setuptools]
include-package-data = true

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.0.0b1",
]

[tool.uv.sources]
agent-utilities = { path = ".uv-workspace-siblings/agent-utilities", editable = true }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [ "pytest-timeout>=2.4.0",]

[tool.setuptools.package-data]
objectstore_mcp = [ "mcp_config.json", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.vulture]
ignore_names = ["request", "config", "local_store_env"]

[tool.setuptools.packages.find]
where = [ ".",]
include = [ "objectstore_mcp*",]
